name: Integration controlee des archives
on:
  push:
    branches: ['codex/reconciliation-archives-20261117']
    paths: ['.github/workflows/integration-archives.yml', '.github/reconciliation/**']
permissions:
  contents: write
concurrency:
  group: integration-archives-bitume
  cancel-in-progress: false
jobs:
  integrer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fusionner sans perdre les corrections recentes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-integration
          git config user.name 'BITUME integration'
          git config user.email '278939511+M4D135@users.noreply.github.com'
          git merge-base --is-ancestor fabb4277c359ea668db40b67f2ae9622b64372af HEAD
          git merge --no-commit --no-ff 247d4445e02129af3c28b242eab9783ca3fb010d || true
          python3 - <<'PY'
          import subprocess
          conflits=set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines())
          assert conflits == {'SIZE.json','VERSION.json','dist/bitume.html'}, conflits
          PY
          git checkout --ours SIZE.json VERSION.json dist/bitume.html
          git rm -f .claude/worktrees/wf_654723d2-ff3-1
          python3 .github/reconciliation/apply.py
          python3 construire.py 2>&1 | tee qualification-integration/build.log
          python3 - <<'PY'
          import hashlib,pathlib,json
          assert hashlib.sha256(pathlib.Path('src/jeu.js').read_bytes()).hexdigest() == 'dc116229a6803da620ea41e9728ee2547ad981cd6aa1615c92870a3bf5901590'
          assert hashlib.sha256(pathlib.Path('dist/bitume.html').read_bytes()).hexdigest() == 'c8ac999b71b1944f50cf3d25c42635f2b6db3b72741be9a0def66793ed9ef76e'
          assert json.loads(pathlib.Path('VERSION.json').read_text())['version'] == '0.2.19'
          PY
      - name: Qualifier toutes les suites avant publication de la branche
        shell: bash
        run: |
          set -euo pipefail
          node --version > qualification-integration/ENVIRONNEMENT.txt
          passed=0; failed=0
          for t in verifications/*.test.mjs; do
            if node "$t" > "qualification-integration/$(basename "$t").log" 2>&1; then
              passed=$((passed+1))
            else
              failed=$((failed+1)); tail -n 40 "qualification-integration/$(basename "$t").log"
            fi
          done
          printf 'Suites reussies : %s\nSuites en echec : %s\n' "$passed" "$failed" | tee qualification-integration/RESUME.txt
          test "$passed" -eq 34
          test "$failed" -eq 0
          node --check src/jeu.js
          git add AGENTS.md README.md SIZE.json VERSION.json dist/bitume.html src/index.html src/jeu.js src/style.css verifications/prets-enligne.test.mjs verifications/rendu-halo.test.mjs docs/RECONCILIATION-ARCHIVE-2026-11-17.md docs/REPRISE4-2026-11-17.md
          git diff --cached --check
          git commit -m 'Merge archive: preparation en ligne fiabilisee, halo retabli (0.2.19)'
          git push origin HEAD:refs/heads/codex/reconciliation-archives-20261117
          git rev-parse HEAD > qualification-integration/COMMIT.txt
          git archive --format=tar.gz --output=qualification-integration/bitume-sources.tar.gz HEAD
          sha256sum dist/bitume.html > qualification-integration/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitume-integration-0.2.19
          path: |
            qualification-integration/
            dist/bitume.html
            VERSION.json
            SIZE.json
          retention-days: 14
