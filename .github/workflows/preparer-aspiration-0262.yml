name: Construire le candidat aspiration 0.2.62
on:
  push:
    branches: ['fix/bitume-aspiration-20261120']
    paths: ['.github/workflows/preparer-aspiration-0262.yml']
permissions:
  contents: write
concurrency:
  group: preparation-aspiration-0262
  cancel-in-progress: false
jobs:
  construire:
    if: github.ref == 'refs/heads/fix/bitume-aspiration-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruire le fichier autonome et contrôler son empreinte
        shell: bash
        run: |
          python3 construire.py
          git diff --exit-code -- VERSION.json SIZE.json
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('dist/bitume.html')
          assert json.loads(pathlib.Path('VERSION.json').read_text())['version']=='0.2.62'
          assert p.stat().st_size==14268457
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='439bea3969ab4651fbebb87d8403f5a54968917ca6bdecede40e7d9140403297'
          print('Build autonome identique au candidat qualifie localement.')
          PY
      - name: Enregistrer uniquement le build contrôlé sur la branche candidate
        shell: bash
        run: |
          if git diff --quiet -- dist/bitume.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist/bitume.html
          git commit -m 'Build BITUME 0.2.62 : aspiration p15, souffle et projections'
          git push origin HEAD:refs/heads/fix/bitume-aspiration-20261120
