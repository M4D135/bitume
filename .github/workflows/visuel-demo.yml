name: Images demos et passages

on:
  pull_request:
    paths:
      - 'src/cinema.js'
      - 'src/realisateur.js'
      - 'src/expressions-pilote.js'
      - 'src/main.js'
      - 'src/voiture.js'
      - 'src/jeu.js'
      - 'src/decor.js'
      - 'src/vitre.js'
      - 'src/sillage.js'
      - 'src/visiere-optique.js'
      - 'src/cockpit-matieres.js'
      - 'tools/captures-demo.mjs'
      - 'tools/controle-visuel.mjs'
      - '.github/workflows/visuel-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visuel-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - groupe: nature
            cas: faune-ete,faune-hiver
          - groupe: securite
            cas: tele-montagne,helico-montagne
          - groupe: volant
            cas: volant-gauche,volant-droite
          - groupe: gestes
            cas: geste-majeur,geste-poing,geste-salut-realisateur
          - groupe: pluie-cockpit
            cas: pluie-cockpit
          - groupe: pluie-poursuite
            cas: pluie-poursuite-sillage
          - groupe: pluie-aerien
            cas: pluie-aerien
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verifier les sources et construire le candidat
        shell: bash
        run: |
          mkdir -p qualification
          git show f41614e1f3887a79ebbd633df3fde754534f202e:dist/bitume.html > qualification/reference-0262.html
          python3 construire.py > qualification/build.log
          git diff --exit-code -- VERSION.json SIZE.json dist/bitume.html
          git rev-parse HEAD > qualification/COMMIT.txt
          git rev-parse 'HEAD^{tree}' > qualification/TREE.txt
          sha256sum dist/bitume.html qualification/reference-0262.html > qualification/SHA256SUMS.txt
          google-chrome --version > qualification/ENVIRONNEMENT.txt
          node --version >> qualification/ENVIRONNEMENT.txt
      - name: Capturer le montage reel en raster logiciel
        shell: bash
        run: |
          node tools/captures-demo.mjs --url "file://$GITHUB_WORKSPACE/dist/bitume.html" --avant "file://$GITHUB_WORKSPACE/qualification/reference-0262.html" --sortie qualification/visuel-demo --chrome /usr/bin/google-chrome --cas "${{ matrix.cas }}"
      - name: Conserver images et diagnostics meme en cas de refus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitume-demo-${{ matrix.groupe }}-${{ github.sha }}
          path: |
            qualification/visuel-demo/
            qualification/COMMIT.txt
            qualification/TREE.txt
            qualification/SHA256SUMS.txt
            qualification/ENVIRONNEMENT.txt
            qualification/build.log
          if-no-files-found: error
          retention-days: 14
