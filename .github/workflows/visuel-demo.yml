name: Images demos des circuits

on:
  push:
    branches: ['codex/**']
  pull_request:
    paths:
      - 'src/cinema.js'
      - 'src/animaux.js'
      - 'src/faune.js'
      - 'src/lieux.js'
      - 'src/realisateur.js'
      - 'src/expressions-pilote.js'
      - 'src/main.js'
      - 'src/voiture.js'
      - 'src/jeu.js'
      - 'src/decor.js'
      - 'src/vitre.js'
      - 'src/sillage.js'
      - 'src/visiere-optique.js'
      - 'src/cockpit-matieres.js'
      - 'tools/captures-demo.mjs'
      - 'tools/qualification/faune-demos.mjs'
      - 'verifications/captures-demo.test.mjs'
      - 'tools/controle-visuel.mjs'
      - '.github/workflows/visuel-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visuel-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[capture-faune-demos]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - groupe: forets-du-pacifique
            cas: route-forets-du-pacifique,trace-forets-du-pacifique,lieu-forets-du-pacifique
          - groupe: marseille
            cas: route-marseille,trace-marseille,lieu-marseille
          - groupe: karst-et-lagon
            cas: route-karst-et-lagon,trace-karst-et-lagon,lieu-karst-et-lagon
          - groupe: sierra
            cas: route-sierra,trace-sierra,lieu-sierra
          - groupe: nord-atlantique
            cas: route-nord-atlantique,trace-nord-atlantique,lieu-nord-atlantique
          - groupe: route-des-cimes
            cas: route-route-des-cimes,trace-route-des-cimes,lieu-route-des-cimes
          - groupe: larche
            cas: route-larche,trace-larche,lieu-larche
          - groupe: baikal
            cas: route-baikal,trace-baikal,lieu-baikal
          - groupe: ovale-des-forges
            cas: route-ovale-des-forges,trace-ovale-des-forges,lieu-ovale-des-forges
          - groupe: securite
            cas: tele-montagne,helico-montagne
          - groupe: meteo
            cas: pluie-cockpit,pluie-poursuite-sillage,pluie-aerien
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verifier les sources et construire le candidat
        shell: bash
        run: |
          mkdir -p qualification
          python3 construire.py > qualification/build.log
          git diff --exit-code -- VERSION.json SIZE.json dist/bitume.html
          git rev-parse HEAD > qualification/COMMIT.txt
          git rev-parse 'HEAD^{tree}' > qualification/TREE.txt
          sha256sum dist/bitume.html > qualification/SHA256SUMS.txt
          google-chrome --version > qualification/ENVIRONNEMENT.txt
          node --version >> qualification/ENVIRONNEMENT.txt
      - name: Capturer le montage reel en raster logiciel
        shell: bash
        run: |
          node tools/qualification/faune-demos.mjs --url "file://$GITHUB_WORKSPACE/dist/bitume.html" --sortie qualification/visuel-demo --chrome /usr/bin/google-chrome --cas "${{ matrix.cas }}"
      - name: Conserver images et diagnostics meme en cas de refus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitume-demo-${{ matrix.groupe }}-${{ github.sha }}
          path: |
            qualification/visuel-demo/
            qualification/COMMIT.txt
            qualification/TREE.txt
            qualification/SHA256SUMS.txt
            qualification/ENVIRONNEMENT.txt
            qualification/build.log
          if-no-files-found: error
          retention-days: 14
