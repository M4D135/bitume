name: Lisibilite cockpit du candidat exact

on:
  push:
    branches: ['codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cockpit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cockpit:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[capture-cockpit]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - groupe: paysage
            cas: cockpit-paysage
          - groupe: profil
            cas: cockpit-profil
          - groupe: trois-quarts
            cas: cockpit-trois-quarts
          - groupe: mac
            cas: cockpit-mac
          - groupe: compact
            cas: cockpit-compact
          - groupe: carte-gauche
            cas: cockpit-carte-gauche
          - groupe: vertical
            cas: cockpit-vertical
          - groupe: duo-haut-bas
            cas: cockpit-duo-haut-bas
          - groupe: duo-cote
            cas: cockpit-duo-cote
          - groupe: carte-gauche-stabilise
            cas: cockpit-carte-gauche-stabilise
          - groupe: carte-droite-stabilise
            cas: cockpit-carte-droite-stabilise
          - groupe: duo-compact
            cas: cockpit-duo-compact
          - groupe: reference-0270
            cas: cockpit-paysage
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruire deux fois le HTML exact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification
          git rev-parse HEAD > qualification/OUTILS-COMMIT.txt
          git rev-parse 'HEAD^{tree}' > qualification/TREE.txt
          node --version > qualification/ENVIRONNEMENT.txt
          google-chrome --version >> qualification/ENVIRONNEMENT.txt
          python3 construire.py > qualification/reconstruction-1.log 2>&1
          sha256sum dist/bitume.html > qualification/HTML-SHA256.txt
          git diff --exit-code -- src/ construire.py VERSION.json SIZE.json dist/ FERRO.lock.json
          python3 construire.py > qualification/reconstruction-2.log 2>&1
          sha256sum --check qualification/HTML-SHA256.txt
          git diff --exit-code -- src/ construire.py VERSION.json SIZE.json dist/ FERRO.lock.json
      - name: Verifier les controles positifs et negatifs de l'outil
        shell: bash
        run: |
          set -euo pipefail
          node verifications/captures-habitacle.test.mjs > qualification/test-outil.log 2>&1
      - name: Recevoir le candidat de reference 0.2.70
        if: matrix.groupe == 'reference-0270'
        uses: actions/checkout@v4
        with:
          ref: 3d9825d4ee6f13525a4b8c0d780e5f127c9a9b4a
          path: qualification/reference-0270
          persist-credentials: false
      - name: Extraire la reference 0.2.70 et verifier son SHA
        if: matrix.groupe == 'reference-0270'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C qualification/reference-0270 rev-parse HEAD)" = 3d9825d4ee6f13525a4b8c0d780e5f127c9a9b4a
          cp qualification/reference-0270/dist/bitume.html qualification/avant-0270.html
          printf '%s\n' 'b0f1b5d905f02fd3e5fe142e7580a6ad6b564273c5cb57993e5a650fed2ad344  qualification/avant-0270.html' > qualification/AVANT-SHA256.txt
          sha256sum --check qualification/AVANT-SHA256.txt
      - name: Capturer chaque disposition et les deux etats
        shell: bash
        env:
          CAS_COCKPIT: ${{ matrix.cas }}
          GROUPE_COCKPIT: ${{ matrix.groupe }}
        run: |
          set -euo pipefail
          args=()
          html="$GITHUB_WORKSPACE/dist/bitume.html"
          if [ "$GROUPE_COCKPIT" = reference-0270 ]; then
            html="$GITHUB_WORKSPACE/qualification/avant-0270.html"
            args+=(--reference-seule oui)
          fi
          timeout --signal=TERM --kill-after=30s 18m node tools/captures-habitacle.mjs \
            --url "file://$html" --sortie qualification/images \
            --cas "$CAS_COCKPIT" --chrome /usr/bin/google-chrome "${args[@]}" \
            > qualification/captures.log 2>&1
          git diff --exit-code -- src/ construire.py VERSION.json SIZE.json dist/ FERRO.lock.json
      - name: Conserver les preuves y compris en cas d'echec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitume-cockpit-${{ matrix.groupe }}-${{ github.sha }}
          path: |
            qualification/*.txt
            qualification/*.json
            qualification/*.log
            qualification/images/
          if-no-files-found: error
          retention-days: 14
