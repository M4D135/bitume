name: Qualification du menu 03

on:
  push:
    branches: ['codex/bitume-p03-menu-20261120']
    paths:
      - 'src/index.html'
      - 'src/style.css'
      - 'src/navigation-menu.js'
      - 'src/menu-arcade.js'
      - 'verifications/menu-arcade*.test.mjs'
      - 'verifications/navigation-menu.test.mjs'
      - 'tools/captures-menu-arcade.mjs'
      - 'docs/reprise/PARALLELE-2026-11-20/raccordements/03-menu.patch'
      - 'docs/reprise/PARALLELE-2026-11-20/raccordements/03-raccord.test.mjs'
      - '.github/workflows/qualification-menu.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: menu-03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  menu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assembler uniquement une copie de qualification
        shell: bash
        run: |
          mkdir -p qualification-menu "$RUNNER_TEMP/bitume-menu-candidat"
          git rev-parse HEAD > qualification-menu/COMMIT.txt
          git rev-parse 'HEAD^{tree}' > qualification-menu/TREE.txt
          git archive HEAD | tar -x -C "$RUNNER_TEMP/bitume-menu-candidat"
          cd "$RUNNER_TEMP/bitume-menu-candidat"
          git apply --check docs/reprise/PARALLELE-2026-11-20/raccordements/03-menu.patch
          git apply docs/reprise/PARALLELE-2026-11-20/raccordements/03-menu.patch
          python3 construire.py > "$GITHUB_WORKSPACE/qualification-menu/construction.log"
          sha256sum dist/bitume.html > "$GITHUB_WORKSPACE/qualification-menu/CANDIDAT-SHA256.txt"
      - name: Vérifier le parcours et les modules liés
        shell: bash
        run: |
          cd "$RUNNER_TEMP/bitume-menu-candidat"
          for test in verifications/menu-arcade*.test.mjs verifications/navigation-menu.test.mjs verifications/manette.test.mjs verifications/commandes-partage.test.mjs verifications/prets-enligne.test.mjs; do
            node "$test" > "$GITHUB_WORKSPACE/qualification-menu/$(basename "$test").log" 2>&1
          done
          node docs/reprise/PARALLELE-2026-11-20/raccordements/03-raccord.test.mjs . > "$GITHUB_WORKSPACE/qualification-menu/raccord.log" 2>&1
      - name: Capturer et parcourir le candidat dans Chromium
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/bitume-menu-browser" --no-save --ignore-scripts playwright@1.62.1 > qualification-menu/installation.log 2>&1
          google-chrome --version > qualification-menu/NAVIGATEUR.txt
          NODE_PATH="$RUNNER_TEMP/bitume-menu-browser/node_modules" node "$RUNNER_TEMP/bitume-menu-candidat/tools/captures-menu-arcade.mjs" --url "file://$RUNNER_TEMP/bitume-menu-candidat/dist/bitume.html" --sortie "$GITHUB_WORKSPACE/qualification-menu/images" --chrome /usr/bin/google-chrome
      - name: Conserver uniquement les preuves du menu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitume-menu-${{ github.sha }}
          path: qualification-menu/
          if-no-files-found: error
          retention-days: 14
